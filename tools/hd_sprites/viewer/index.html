<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caesar III HD Sprites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@600&display=swap">
<style>
:root {
  --umber: #26231e; --tufa: #302c25; --tufa-2: #3a352d; --line: #4a4338; --marble: #f0e9dc; --dim: #b3a893;
  --purple: #a56bd0; --purple-bg: #3b2a47;
  --installed: #4fb39a; --pass: #6e9fe0; --fail: #e5604f; --stale: #d9a843; --none: #7d7464;
  --c3: #8db255; --c3_north: #a8cbe0; --c3_south: #e0bd72;
  --ground: #1d1b17; --thumb: 168px;
  --font: "Alegreya Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--umber); color: var(--marble); font: 15px/1.4 var(--font); display: grid; overflow: hidden;
       grid-template: "top top" auto "rail main" 1fr / 272px 1fr; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* top bar: wordmark, search, progress, jobs */
header { grid-area: top; display: flex; align-items: center; gap: 20px; padding: 10px 18px; background: var(--tufa); border-bottom: 1px solid var(--line); }
.mark { font-family: Cinzel, serif; font-weight: 600; font-size: 19px; letter-spacing: .12em; white-space: nowrap; }
.mark span { color: var(--dim); font-size: 13px; letter-spacing: .2em; margin-left: 6px; }
.search { flex: 1; max-width: 560px; position: relative; }
.search input { width: 100%; background: var(--umber); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 8px 34px; }
.search input::placeholder { color: var(--none); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--dim); }
.progress { display: flex; align-items: center; gap: 12px; margin-left: auto; font-size: 13px; color: var(--dim); }
.bar { display: flex; height: 6px; width: 180px; border-radius: 3px; overflow: hidden; background: var(--tufa-2); }
.bar i { display: block; height: 100%; }
.jobs { display: flex; align-items: center; gap: 6px; color: var(--stale); font-size: 13px; }
.spin { width: 10px; height: 10px; border: 2px solid var(--stale); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.mode { font-size: 12px; color: var(--dim); }

/* filter rail */
#rail { grid-area: rail; overflow: auto; border-right: 1px solid var(--line); padding: 6px 0 40px; background: var(--umber); }
.facet { padding: 10px 16px 6px; border-bottom: 1px solid #ffffff0a; }
.facet h3 { margin: 0 0 6px; font-size: 13px; font-weight: 700; color: var(--dim); display: flex; justify-content: space-between; }
.facet h3 button { background: none; border: 0; color: var(--purple); cursor: pointer; font-size: 12px; padding: 0; }
.opt { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; padding: 3px 6px; margin: 0 -6px; border-radius: 6px;
       cursor: pointer; text-align: left; width: calc(100% + 12px); }
.opt:hover { background: var(--tufa); }
.opt .box { width: 14px; height: 14px; border: 1.5px solid var(--line); border-radius: 4px; flex: none; display: grid; place-items: center; }
.opt.on .box { background: var(--purple); border-color: var(--purple); }
.opt.on .box::after { content: ""; width: 7px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.opt .lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .n { color: var(--dim); font-size: 13px; }
.opt.zero { opacity: .4; }
.opt .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.opt .mini { display: flex; width: 44px; height: 4px; border-radius: 2px; overflow: hidden; background: var(--tufa-2); flex: none; }
.opt .mini i { display: block; height: 100%; }
.fp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.fp .opt { margin: 0; width: auto; flex-direction: column; gap: 2px; padding: 6px 2px; border: 1px solid var(--line); border-radius: 8px; text-align: center; }
.fp .opt.on { border-color: var(--purple); background: var(--purple-bg); }
.fp .opt svg { color: var(--dim); }
.fp .opt.on svg { color: var(--marble); }
.groupfind { width: 100%; background: var(--tufa); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin-bottom: 6px; font-size: 13px; }
.grouplist { max-height: 360px; overflow: auto; margin: 0 -6px; padding: 0 6px; }
.grouplist h4 { margin: 8px 0 2px; font-size: 12px; font-weight: 500; color: var(--none); }

/* main: active filters, toolbar, grid */
main { grid-area: main; overflow: auto; padding: 0 18px 60px; }
.toolbar { position: sticky; top: 0; z-index: 3; background: var(--umber); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 0 10px; }
.count { font-size: 18px; font-weight: 700; margin-right: 4px; }
.count span { color: var(--dim); font-weight: 400; font-size: 14px; }
.tag { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--purple); background: var(--purple-bg); border-radius: 14px; padding: 2px 6px 2px 10px; font-size: 13px; cursor: pointer; }
.tag b { font-weight: 500; color: var(--dim); }
.tag::after { content: "×"; color: var(--dim); font-size: 15px; line-height: 1; }
.clear { background: none; border: 0; color: var(--purple); cursor: pointer; font-size: 13px; }
.tools { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--dim); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--tufa-2); color: var(--marble); }
.seg button:disabled { opacity: .35; cursor: default; }
select { background: var(--tufa); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--thumb), 1fr)); gap: 10px; }
.ghead { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; padding: 14px 0 2px; border-bottom: 1px solid var(--line); }
.ghead:first-child { padding-top: 0; }
.ghead h2 { margin: 0; font-size: 16px; font-weight: 700; }
.ghead span { color: var(--dim); font-size: 13px; }
.card { background: var(--tufa); border: 1px solid transparent; border-radius: 6px; overflow: hidden; cursor: pointer; content-visibility: auto;
        contain-intrinsic-size: var(--thumb) calc(var(--thumb) * .68 + 34px); }
.card:hover, .card:focus-visible { border-color: var(--purple); }
.thumb { position: relative; height: calc(var(--thumb) * .68); background: var(--ground); }
.thumb img { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.thumb img.px { image-rendering: pixelated; }
.thumb .b { visibility: hidden; }
.card:hover .thumb .a.swap { visibility: hidden; }
.card:hover .thumb .b { visibility: visible; }
.thumb .split { clip-path: inset(0 0 0 50%); }
.thumb .hint { position: absolute; right: 5px; bottom: 4px; font-size: 11px; color: #fffc; background: #0008; border-radius: 4px; padding: 0 5px; visibility: hidden; }
.card:hover .hint { visibility: visible; }
.foot { display: flex; align-items: center; gap: 6px; padding: 5px 8px; font-size: 13px; }
.foot .id { color: var(--dim); }
.foot .cl { width: 8px; height: 8px; border-radius: 50%; }
.foot .st { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim); }
.pip { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.fails { padding: 0 8px 6px; font-size: 11px; color: var(--fail); line-height: 1.3; }
.empty { padding: 60px 0; color: var(--dim); text-align: center; }
.empty button { margin-top: 10px; }
#sentinel { height: 1px; }

/* status and climate colours */
.s-installed { background: var(--installed); } .s-pass { background: var(--pass); } .s-fail { background: var(--fail); }
.s-stale { background: var(--stale); } .s-none { background: var(--none); }
.c-c3 { background: var(--c3); } .c-c3_north { background: var(--c3_north); } .c-c3_south { background: var(--c3_south); }
.bg-dark { --ground: #1d1b17; } .bg-grass { --ground: #4f6b22; } .bg-sand { --ground: #b49863; }
.bg-check { --ground: repeating-conic-gradient(#3a352d 0 25%, #2b2722 0 50%) 0 0 / 14px 14px; }

/* detail drawer */
#shade { position: fixed; inset: 0; background: #0007; opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 9; }
#shade.open { opacity: 1; pointer-events: auto; }
#detail { position: fixed; inset: 0 0 0 auto; width: min(1080px, 100vw); background: var(--tufa); border-left: 1px solid var(--line);
          transform: translateX(102%); transition: transform .18s ease-out; z-index: 10; display: flex; flex-direction: column; }
#detail.open { transform: none; }
.dhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.dhead h2 { margin: 0; font-size: 22px; font-weight: 700; }
.dhead h2 small { font-weight: 400; color: var(--dim); font-size: 15px; margin-left: 8px; }
.dhead .sp { flex: 1; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.x { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.dbody { overflow: auto; padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 18px; }
.dbody > * { flex: none; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--dim); font-size: 14px; }
.facts b { color: var(--marble); font-weight: 500; }
.stage { position: relative; border-radius: 8px; background: var(--ground); min-height: 280px; display: flex; overflow: auto; padding: 28px; }
.wipe { position: relative; margin: auto; flex: none; cursor: ew-resize; }
.wipe img { display: block; }
.wipe .o { image-rendering: pixelated; }
.wipe .nw { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--cut, 50%)); }
.wipe .line { position: absolute; top: -8px; bottom: -8px; left: var(--cut, 50%); width: 2px; margin-left: -1px; background: var(--purple); pointer-events: none; }
.wipe .lab { position: absolute; top: -22px; font-size: 12px; color: var(--dim); }
.stagebar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--dim); }
.stagebar .sp { flex: 1; }
.sec h3 { margin: 0 0 8px; font-size: 15px; font-weight: 700; }
.sec h3 span { font-weight: 400; color: var(--dim); font-size: 13px; margin-left: 6px; }
.views { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.views figure { margin: 0; }
.views figcaption { color: var(--dim); font-size: 12px; margin-top: 4px; }
.views .pad { background: var(--ground); border-radius: 6px; padding: 8px; display: inline-block; }
.views img { display: block; }
.atts { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.att { flex: none; width: 140px; background: var(--umber); border: 1px solid var(--line); border-radius: 6px; padding: 6px; cursor: pointer; font-size: 12px; text-align: left; }
.att.on { border-color: var(--purple); background: var(--purple-bg); }
.att .pad { background: var(--ground); border-radius: 4px; height: 70px; display: grid; place-items: center; margin-bottom: 5px; overflow: hidden; }
.att img { max-width: 124px; max-height: 64px; }
.att .ok { color: var(--installed); } .att .bad { color: var(--fail); }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn { background: var(--tufa-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
.btn:hover { border-color: var(--purple); }
.btn.primary { background: var(--purple); border-color: var(--purple); color: #fff; font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }
.note { color: var(--dim); font-size: 13px; }
table.checks { border-collapse: collapse; width: 100%; font-size: 14px; }
table.checks td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.checks td:first-child { width: 24px; } table.checks td:nth-child(2) { width: 100px; font-weight: 500; }
.ok { color: var(--installed); } .bad { color: var(--fail); }
.tiling { position: relative; background: var(--ground); border-radius: 6px; }
.tiling img { position: absolute; }
code { font-size: 12px; color: var(--dim); }
.keys { color: var(--dim); font-size: 12px; }
.keys kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font: inherit; color: var(--marble); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); background: var(--tufa-2); border: 1px solid var(--installed);
         padding: 10px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 20; max-width: 80vw; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); } #toast.bad { border-color: var(--fail); }
#railtoggle { display: none; }
@media (max-width: 860px) {
  body { grid-template: "top" auto "main" 1fr / 1fr; }
  header { flex-wrap: wrap; gap: 10px; }
  .progress .bar { display: none; }
  #rail { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 8; transform: translateX(-102%); transition: transform .18s; background: var(--umber); }
  #rail.open { transform: none; }
  #railtoggle { display: inline-block; }
  main { padding: 0 12px 60px; }
}
@media (prefers-reduced-motion: reduce) { #detail, #rail, #shade, #toast { transition: none; } .spin { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="mark">CAESAR III<span>HD SPRITES</span></div>
  <button class="btn" id="railtoggle" aria-controls="rail">Filters</button>
  <label class="search">
    <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6"/></svg>
    <input type="search" id="q" placeholder="Search: 2779, 2779-2790, tent 1x1 north, failing" aria-label="Search sprites by id, range or tag" autocomplete="off">
  </label>
  <div class="jobs" id="jobs" aria-live="polite"></div>
  <div class="progress" id="progress"></div>
</header>
<nav id="rail" aria-label="Filters"></nav>
<main id="main">
  <div class="toolbar" id="toolbar"></div>
  <div class="grid" id="grid"></div>
  <div id="sentinel"></div>
</main>
<div id="shade"></div>
<section id="detail" aria-hidden="true" aria-label="Sprite details"></section>
<div id="toast" role="status"></div>
<script src="data.js"></script>
<script>
// Served by viewer/server: live data and actions. Opened from disk: data.js, read-only.
const LIVE = location.protocol.startsWith('http');
let D = window.C3DATA || { built: '-', groups: [], sprites: [] };
const CLIMATE = { c3: 'Central', c3_north: 'North', c3_south: 'South' };
const STATUS = { installed: 'Installed', pass: 'Passing', fail: 'Failing', stale: 'Old in game', none: 'Not started' };
const CATS = ['Terrain', 'Housing', 'Buildings', 'Walkers', 'Empire map', 'Minimap', 'Interface', 'Ungrouped'];
const HAS = { top: 'Top part', script: 'Build script', attempts: 'Attempts', variant: 'Own climate image', shared: 'Same in all climates' };
const PREFIX = /^(BUILDING_|TERRAIN_|FIGURE_|EMPIRE_|MINIMAP_)/;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// ---- view state: in the URL hash, so the back button and reload keep it ----
const FKEYS = ['status', 'cl', 'fp', 'cat', 'has', 'g'];
const st = { f: Object.fromEntries(FKEYS.map(k => [k, new Set()])), q: '', sort: 'id', show: 'new', size: 'm', bg: 'dark', open: null };
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  FKEYS.forEach(k => st.f[k] = new Set((p.get(k) || '').split(',').filter(Boolean)));
  st.q = p.get('q') || ''; st.sort = p.get('sort') || 'id'; st.show = p.get('show') || 'new';
  st.size = p.get('size') || 'm'; st.bg = p.get('bg') || 'dark'; st.open = p.get('open');
}
function writeHash() {
  const p = new URLSearchParams();
  FKEYS.forEach(k => st.f[k].size && p.set(k, [...st.f[k]].join(',')));
  if (st.q) p.set('q', st.q);
  for (const [k, d] of [['sort', 'id'], ['show', 'new'], ['size', 'm'], ['bg', 'dark']]) if (st[k] !== d) p.set(k, st[k]);
  if (st.open) p.set('open', st.open);
  const h = p.toString().replace(/%2C/g, ',').replace(/%3A/g, ':');
  if (h !== location.hash.slice(1)) history.replaceState(null, '', h ? '#' + h : location.pathname);
}

// ---- data preparation ----
let groups = new Map(), byKey = new Map(), byId = new Map();
const sub = cl => cl === 'c3' ? '' : cl + '/';
const origSrc = s => `../originals/${sub(s.cl)}${s.id}.png`;
const keyOf = s => `${s.cl}:${s.id}`;
const prettyGroup = g => g ? g.name.replace(PREFIX, '').toLowerCase().replace(/_/g, ' ') : 'ungrouped';
const fpLabel = n => +n ? `${n}×${n}` : 'Flat';

function status(s) {
  const inst = s.installed_attempt && (s.attempts || []).find(a => a.stamp === s.installed_attempt);
  if (inst) return inst.ok ? 'installed' : 'fail';
  if (s.installed && !s.installed_current) return 'stale';
  if (!s.hd && !s.attempts) return 'none';
  const fails = s.checks ? Object.values(s.checks).filter(v => !v[0]).length : 0;
  if (s.installed && !fails) return 'installed';
  return fails ? 'fail' : 'pass';
}
function prepare() {
  groups = new Map(D.groups.map(g => [g.id, g])); byKey = new Map(); byId = new Map();
  for (const s of D.sprites) {
    const g = groups.get(s.g);
    s.key = keyOf(s); s.status = status(s); s.cat = g ? g.category : 'Ungrouped'; s.gname = prettyGroup(g);
    const inst = s.installed_attempt && (s.attempts || []).find(a => a.stamp === s.installed_attempt);
    s.fails = inst ? inst.fails : s.checks ? Object.entries(s.checks).filter(([, v]) => !v[0]).map(([k]) => k) : [];
    s.has = [];
    if (s.top) s.has.push('top');
    if (s.script) s.has.push('script');
    if (s.attempts) s.has.push('attempts');
    if (s.cl !== 'c3') s.has.push('variant');
    if (s.cl === 'c3' && s.same && s.same.length === 2) s.has.push('shared');
    s.words = [s.gname, s.cat, CLIMATE[s.cl], STATUS[s.status], s.tiles ? `${s.tiles}x${s.tiles}` : 'flat', ...s.has.map(h => HAS[h])].join(' ').toLowerCase();
    byKey.set(s.key, s);
    if (!byId.has(s.id)) byId.set(s.id, []);
    byId.get(s.id).push(s);
  }
}

// ---- filtering: OR inside a facet (AND for "has"), AND between facets and search words ----
const FACET_GET = { status: s => [s.status], cl: s => [s.cl], fp: s => [String(s.tiles)], cat: s => [s.cat], has: s => s.has, g: s => [String(s.g)] };
function facetOk(k, s) {
  const sel = st.f[k]; if (!sel.size) return true;
  const v = FACET_GET[k](s);
  return k === 'has' ? [...sel].every(x => v.includes(x)) : v.some(x => sel.has(x));
}
function searchOk(s, words) {
  for (const w of words) {
    let m;
    if (/^#?\d+$/.test(w)) { if (!String(s.id).startsWith(w.replace('#', ''))) return false; }
    else if ((m = w.match(/^(\d+)-(\d+)$/))) { if (s.id < +m[1] || s.id > +m[2]) return false; }
    else if (!s.words.includes(w.replace(/×/g, 'x'))) return false;
  }
  return true;
}
let current = [], counts = {};
function applyFilters() {
  const words = st.q.toLowerCase().split(/\s+/).filter(Boolean);
  counts = Object.fromEntries(FKEYS.map(k => [k, {}]));
  current = [];
  for (const s of D.sprites) {
    if (!searchOk(s, words)) continue;
    let miss = null, n = 0;
    for (const k of FKEYS) if (!facetOk(k, s)) { miss = k; if (++n > 1) break; }
    if (n > 1) continue;
    // counts of a facet ignore its own selection, so each option shows what it adds
    for (const k of (n ? [miss] : FKEYS)) for (const v of FACET_GET[k](s)) counts[k][v] = (counts[k][v] || 0) + 1;
    if (!n) current.push(s);
  }
  const by = {
    id: (a, b) => a.id - b.id || a.cl.localeCompare(b.cl),
    recent: (a, b) => (b.rendered || 0) - (a.rendered || 0) || a.id - b.id,
    status: (a, b) => Object.keys(STATUS).indexOf(a.status) - Object.keys(STATUS).indexOf(b.status) || a.id - b.id,
  };
  current.sort(by[st.sort] || by.id);
}

// ---- filter rail ----
const FP_ICON = n => {
  if (!+n) return `<svg width="26" height="18" viewBox="0 0 26 18" aria-hidden="true"><rect x="6" y="2" width="14" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`;
  const k = +n; let lines = '';
  for (let i = 1; i < k; i++) {
    const t = i / k;
    lines += `<path d="M${1 + 12 * t},${9 - 8 * t} L${13 + 12 * t},${17 - 8 * t}" />`;
    lines += `<path d="M${1 + 12 * t},${9 + 8 * t} L${13 + 12 * t},${1 + 8 * t}" />`;
  }

    html += `<img src="${src}" width="${58 * z}" height="${th}" style="left:${(x - y) * 30 * z + tw + 10}px;top:${(x + y) * 15 * z + 10}px;${isNew ? footClip(t, z) : 'image-rendering:pixelated;'}" alt="">`;
  }
  return html + '</div>';
}
function closeDetail() {
  st.open = null; writeHash();
  $('detail').classList.remove('open'); $('detail').setAttribute('aria-hidden', 'true'); $('shade').classList.remove('open');
}
$('shade').onclick = closeDetail;
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === 'Escape') { closeDetail(); $('rail').classList.remove('open'); }
  else if (e.key === '/') { e.preventDefault(); q.focus(); }
  else if (st.open && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const i = current.findIndex(s => s.key === st.open), n = current[i + (e.key === 'ArrowRight' ? 1 : -1)];
    if (n) openDetail(n.key);
  }
});

// ---- server actions and jobs ----
let jobs = [], polling = null;
function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 4500);
}
async function act(kind, body, okMsg) {
  try {
    const r = await fetch('/api/' + kind, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) return toast(j.error || r.statusText, true);
    toast(okMsg);
    if (kind === 'generate') await pollJobs(); else await refresh();
  } catch (e) { toast(String(e), true); }
}
function renderJobs() {
  const active = jobs.filter(j => j.status === 'queued' || j.status === 'running');
  $('jobs').innerHTML = active.length ? `<span class="spin"></span>${active.filter(j => j.status === 'running').length} rendering · ${active.filter(j => j.status === 'queued').length} queued` : '';
  $('jobs').title = jobs.slice(0, 12).map(j => `${j.sprite} ${CLIMATE[j.climate || 'c3']} seed ${j.seed}: ${j.status}`).join('\n');
}
async function pollJobs() {
  if (!LIVE) return;
  const before = new Map(jobs.map(j => [j.id, j.status]));
  try { jobs = await (await fetch('/api/jobs')).json(); } catch (e) { return; }
  renderJobs();
  const finished = jobs.filter(j => (j.status === 'done' || j.status === 'failed') && before.get(j.id) && before.get(j.id) !== j.status);
  for (const j of finished) toast(j.status === 'done' ? `${j.sprite}: a new attempt is ready (seed ${j.seed})` : `${j.sprite}: the render failed. ${j.log.split('\n').slice(-3).join(' ')}`, j.status !== 'done');
  if (finished.length) await refresh();
  else if (st.open && jobs.some(j => `${j.climate || 'c3'}:${j.sprite}` === st.open && before.get(j.id) !== j.status)) openDetail(st.open, true);
  clearTimeout(polling);
  if (jobs.some(j => j.status === 'queued' || j.status === 'running')) polling = setTimeout(pollJobs, 2000);
}
async function refresh() {
  if (LIVE) {
    try { const r = await fetch('/api/data'); if (r.ok) D = await r.json(); else toast((await r.json()).error, true); }
    catch (e) { toast(String(e), true); }
  }
  prepare(); catBars = Object.fromEntries(CATS.map(c => [c, catProgress(c)]));
  renderProgress(); update();
  if (st.open) openDetail(st.open, true);
}
readHash(); q.value = st.q;
window.addEventListener('hashchange', () => { readHash(); q.value = st.q; update(); st.open ? openDetail(st.open, true) : closeDetail(); });
prepare(); catBars = Object.fromEntries(CATS.map(c => [c, catProgress(c)]));
renderProgress(); update(); if (st.open) openDetail(st.open, true);
if (LIVE) refresh().then(pollJobs);
</script>
